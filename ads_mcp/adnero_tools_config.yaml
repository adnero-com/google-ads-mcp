# The adnero fork's tool set (ADNERO.md): upstream's namespaces as they are,
# minus the stdio-only video upload, plus ours. Selected in Dockerfile.adnero
# with GOOGLE_ADS_MCP_TOOLS_CONFIG. AdHive's gateway classifies every tool
# listed here (packages/mcp-gateway google-ads-tools.ts); a new one fails its test.
namespaces:
  customers: true
  search: true
  metadata: true
  labels: true
  assets:
    enabled_tools:
      - create_asset: true
      # stdio-only (a local file path, a background task): never offered in the gateway build.
      # assets_add_youtube covers videos already on YouTube.
      - upload_video_asset: false
      - upload_image: true
      - upload_html5: true
      - add_youtube: true
      - list: true
  accounts: true  # list_clients, list_accessible
  campaigns: true
  keywords: true
  app: true  # check, campaign_create, ad_group_create, ad_update, campaign_update
  api: true  # read, mutate (raw REST passthrough under one customer)
